name: Update profile art

# Refreshes the README cards daily from real contribution data,
# plus whenever you push to main, plus on demand.

"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC every day
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape contribution data (no auth needed)
        run: python scripts/fetch_contributions.py

      - name: Render README cards (hero, tiles, activity, repos, blue graph)
        run: python scripts/render_readme_cards.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898113+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json cards
          git diff --cached --quiet || (git commit -m "chore: refresh profile cards [skip ci]" && git push)
